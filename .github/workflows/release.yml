name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI (vet, lint, unit tests, e2e on Helm 3 and 4, snapshot build) runs on the tagged
  # commit. Publishing waits for all of it.
  ci:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
