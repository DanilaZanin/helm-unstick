version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - nolintlint
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
    staticcheck:
      # The golangci-lint defaults, plus QF1008: internal/cluster spells out
      # cfg.Releases.Driver.Query on purpose, so it compiles whether or not Helm's
      # Storage embeds its Driver.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1008"]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DanilaZanin/helm-unstick
