apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
{{- if .Values.progressDeadline }}
  progressDeadlineSeconds: {{ .Values.progressDeadline }}
{{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        rollout: {{ .Values.rollout | quote }}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: {{ .Values.image }}
          command:
            - sh
            - -c
            - sleep {{ .Values.readinessDelay }}; touch /tmp/ready; sleep 3600
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            periodSeconds: 1
